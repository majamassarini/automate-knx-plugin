[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automate-knx-plugin"
version = "0.9.1"
description = "A KNX plugin for automate-home"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Maja Massarini", email = "maja.massarini@gmail.com" }]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Intended Audience :: Developers",
]
dependencies = ["automate-home", "knx-stack"]

[project.urls]
Homepage = "https://github.com/majamassarini/automate-knx-plugin"

[project.optional-dependencies]
dev = [
    "flake8",
    "flake8-pyproject",
    "black",
    "mypy",
    "coverage",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["knx_plugin*"]

[tool.coverage.run]
command_line = "-m unittest discover"
omit = ["*tests*", "*__init__.py"]

[tool.coverage.report]
omit = ["*tests*", "*__init__.py"]

[tool.mypy]
no_strict_optional = true
exclude = ["knx_plugin/tests/", "^docs/"]
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["home", "home.*", "knx_stack", "knx_stack.*"]
ignore_missing_imports = true

[tool.black]
line-length = 79

[tool.flake8]
max-line-length = 79
max-doc-length = 120
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "venv",
    "*.egg-info",
]
extend-ignore = [
    # whitespace before ':' – black formats slices this way
    "E203",
    # line break before binary operator – black prefers this
    "W503",
    # line too long – black handles code; doctest strings can't be wrapped
    "E501",
    # undefined name in string annotations (forward references)
    "F821",
]
per-file-ignores = [
    # deferred imports at bottom of __init__.py break circular imports;
    # the symbols are public API re-exports, not unused imports
    "*/__init__.py:F401,E402",
    # doc lines too long in these files
    "knx_plugin/trigger/custom_clima.py:W505",
    "knx_plugin/trigger/dpt_value_lux/balance.py:W505",
]
