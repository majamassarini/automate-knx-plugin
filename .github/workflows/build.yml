name: Unit Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dev dependencies
      run: |
        python -m pip install --upgrade pip
        pip install git+https://github.com/majamassarini/knx-stack.git@main
        pip install git+https://github.com/majamassarini/automate-home.git@main
        pip install ".[dev]"

    - name: Run black check
      run: black --check .

    - name: Run flake8
      run: flake8

    - name: Run mypy
      run: mypy knx_plugin

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install coverage
        pip install git+https://github.com/majamassarini/knx-stack.git@main
        pip install git+https://github.com/majamassarini/automate-home.git@main
        pip install .

    - name: Run unit tests with coverage
      run: |
        python -m coverage run -m unittest discover -v

    - name: Run doctests
      run: |
        python -m doctest knx_plugin/gateway/knxnet_ip.py -v || true
        python -m doctest knx_plugin/message.py -v || true

    - name: Generate coverage report
      run: |
        python -m coverage report -m
        python -m coverage html

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: htmlcov/

  docs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install git+https://github.com/majamassarini/knx-stack.git@main
        pip install git+https://github.com/majamassarini/automate-home.git@main
        pip install ".[docs]"

    - name: Build documentation
      run: make docs

    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: docs
        path: docs/build/html/
